[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodeck-app"
version = "5.0.0"
description = "AutoDeck v5: review app -- textured scan preview, outlines, auto-fit, seams and sheet nesting"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.0,<4",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "rhino3dm>=8.0",
  "ezdxf==1.4.4",
  "shapely==2.1.1",
]

[project.scripts]
autodeck-app = "autodeck_app.__main__:main"

[tool.setuptools.packages.find]
include = ["autodeck_app*"]

[tool.setuptools.package-data]
autodeck_app = ["static/*", "static/vendor/*"]
